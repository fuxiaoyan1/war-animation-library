name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node agents/skills/animation-assistant/scripts/check-animation-project.mjs .
      - uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist
          if-no-files-found: error

  smoke:
    needs: build-and-health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist
      - name: Smoke shard ${{ matrix.shard }}/8
        run: npm run test:smoke -- --fully-parallel --shard=${{ matrix.shard }}/8 --workers=1 --retries=1 --reporter=github,line
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-shard-${{ matrix.shard }}-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

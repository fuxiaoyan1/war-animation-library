      .river-thin{fill:none;stroke:#376b70;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.42}
      .boundary{fill:none;stroke:#5b3c21;stroke-width:1.5;stroke-dasharray:13 10;stroke-linecap:round;opacity:.46}
      .place{fill:#3b2413;font-family:"Songti SC","STSong","Kaiti SC",serif;font-weight:700;letter-spacing:8px;opacity:.74}
      .small-place{fill:#3b2413;font-family:"Songti SC","STSong","Kaiti SC",serif;font-weight:600;letter-spacing:4px;opacity:.6}
      .seal{fill:none;stroke:#5a321c;stroke-width:2;opacity:.34}
    </style>
  </defs>


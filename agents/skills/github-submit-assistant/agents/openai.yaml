display_name: GitHub Submit Assistant
short_description: Prepare bilingual update notes, source index, disclaimer and notice checks, validation, commit, and push for war-animation releases.
default_prompt: Use this skill to prepare the war-animation repository for a GitHub update: inspect all dirty work, keep README/NOTICE/DISCLAIMER/SOURCE_INDEX/source logs consistent, update bilingual release notes and public explanatory docs, run validation, commit everything, and push.
